name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    env:
      GATEWAY_TEST_BACKEND: ${{ matrix.backend }}
      GATEWAY_TEST_PG_URL: postgres://gw:gw@127.0.0.1:5432/gw_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gw
          POSTGRES_PASSWORD: gw
          POSTGRES_DB: gw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gw" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t webhook-connector-gateway .
