# Gateway + mock downstream + Prometheus.
# Start:  GATEWAY_ADMIN_TOKEN=change-me docker compose up --build
services:
  gateway:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-change-me}
      # Demo key for local runs (32 zero bytes, base64). Not a secret. Set your own for real use.
      GATEWAY_SECRET_PRIMARY: ${GATEWAY_SECRET_PRIMARY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      RUST_LOG: info
    volumes:
      - ./deploy/gateway.compose.toml:/etc/gateway/gateway.toml:ro
      - gateway-data:/data
    depends_on: [downstream]
  downstream:
    build: .
    entrypoint: ["mock-downstream"]
    environment:
      BIND: 0.0.0.0:9000
      WEBHOOK_SECRET: demo-secret
    ports: ["127.0.0.1:9000:9000"]
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/rules:/etc/prometheus/rules:ro
    depends_on: [gateway]
volumes:
  gateway-data:
